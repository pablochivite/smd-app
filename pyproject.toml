[project]
name = "ledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pablochivite", email = "252613341+pablochivite@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
